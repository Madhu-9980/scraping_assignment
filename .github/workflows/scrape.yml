name: Run scraper

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraping pipeline
        run: python main.py --delay 0.3 --skip-details

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public results page
        run: |
          mkdir -p site
          cp output/final_dataset.csv output/summary_report.json site/
          cp index.html site/

      - name: Upload scraping results
        uses: actions/upload-artifact@v4
        with:
          name: scraping-results
          path: |
            output/final_dataset.csv
            output/summary_report.json
            output/rejected_records.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
